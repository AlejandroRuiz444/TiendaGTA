[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Timeouts extendidos para webhooks de pago
[functions]
  node_bundler = "nft"

[[headers]]
  for = "/api/webhooks/*"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature, x-signature, x-request-id"
